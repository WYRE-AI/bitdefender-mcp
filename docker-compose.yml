services:
  # Gateway mode. The API key and Control Center access URL arrive per request
  # on X-Bitdefender-Api-Key and X-Bitdefender-Access-Url. Do not set
  # BITDEFENDER_API_KEY, BITDEFENDER_ACCESS_URL, or env_file here — that would
  # put static vendor credentials in the container. The project .env is used
  # only for Compose interpolation of CONDUIT_S2S_SECRET.
  bitdefender-mcp:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - MCP_TRANSPORT=http
      - MCP_HTTP_HOST=0.0.0.0
      - MCP_HTTP_PORT=8080
      - AUTH_MODE=gateway
      - LOG_LEVEL=info
      - CONDUIT_S2S_SECRET=${CONDUIT_S2S_SECRET:?set CONDUIT_S2S_SECRET}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
